title = Podcast Service - Lecture Capture Opt-out

future.title = Upcoming Events
future.text = Below are all the events associated with you in the timetable. Instructions on how to use the opt-out this page can be found <a href="http://www.mypodcasts.manchester.ac.uk/support/opt-out/">here</a>. Please note, if a student is registered with the Disability Advisory Support Service (DASS) and DASS has determined that access to the recording is a reasonable adjustment for that student, a recording will be made even if the event is opted-out or set for editing, the recording will only be viewable by DASS students and staff registered on the unit. More information on DASS recordings can be found <a href="https://supportcentre.manchester.ac.uk/ServiceDesk.WebAccess/wd/object/open.rails?class_name=Knowledge.Article&key=17f5493c-7ecc-482e-95ca-a9cdb1013262">here</a>.

