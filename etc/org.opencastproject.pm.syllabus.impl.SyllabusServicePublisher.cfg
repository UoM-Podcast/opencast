# org.opencastproject.pm.syllabus.impl.SyllabusServicePublisher.cfg

# Database information for the Syllabus+ database
# The Syllabus+ database is usually MS SQLServer and the default values assume that
# The dummy test Syllabus+ database can be deployed using MySQL/MariaBD and the settings
# for that are provided below

# Identity of this connection defaults to [Syllabus+]
# db.identity=Syllabus+

# Java driver class for database, defaults to [net.sourceforge.jtds.jdbc.Driver]
db.driver=net.sourceforge.jtds.jdbc.Driver

# Database URI. Required for service to be available
#db.url=jdbc:mysql://localhost:3306/syllabusplus

# Database user. Required.
#db.user=syllabus

# Database password. Required.
#db.password=CHANGE_ME

#db.schema can be provided for databases (eg SQLServer) that use this extra structural layer
#db.schema=rdowner
